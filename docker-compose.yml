x-log-rotation: &log-rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    logging: *log-rotation
  backend:
    image: recon-webapp-backend:latest
    # Compose v2 uses BuildKit automatically. For older Docker/Compose, set DOCKER_BUILDKIT=1 before building.
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      RECON_DATA_DIR: /data
      DEFAULT_FFUF_WORDLIST: /app/wordlists/default/common.txt
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ENABLE_DOCKER_LOG_VIEWER: ${ENABLE_DOCKER_LOG_VIEWER:-true}
      DOCKER_LOG_TAIL: ${DOCKER_LOG_TAIL:-200}
      DOCKER_LOG_MAX_TAIL: ${DOCKER_LOG_MAX_TAIL:-2000}
      DOCKER_LOG_BUFFER_LIMIT: ${DOCKER_LOG_BUFFER_LIMIT:-10000}
      DOCKER_LOG_ALLOWED_SERVICES: ${DOCKER_LOG_ALLOWED_SERVICES:-backend,worker,frontend,redis}
      DOCKER_LOG_REDACTION: ${DOCKER_LOG_REDACTION:-true}
    volumes:
      - recon-data:/data
      - ./wordlists:/data/wordlists
      - ./screenshots:/data/screenshots
      - ./raw-output:/data/raw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8000:8000"
    depends_on:
      - redis
    logging: *log-rotation
  worker:
    image: recon-webapp-backend:latest
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      RECON_DATA_DIR: /data
      DEFAULT_FFUF_WORDLIST: /app/wordlists/default/common.txt
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - recon-data:/data
      - ./wordlists:/data/wordlists
      - ./screenshots:/data/screenshots
      - ./raw-output:/data/raw
    depends_on:
      - redis
    logging: *log-rotation
  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    logging: *log-rotation
volumes:
  redis-data:
  recon-data:
