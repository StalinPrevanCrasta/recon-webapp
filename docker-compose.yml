x-log-rotation: &log-rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    logging: *log-rotation
  backend:
    image: recon-webapp-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      PATH: /root/go/bin:/usr/local/go/bin:/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      RECON_DATA_DIR: /data
      DEFAULT_FFUF_WORDLIST: /app/wordlists/default/common.txt
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ENABLE_DOCKER_LOG_VIEWER: ${ENABLE_DOCKER_LOG_VIEWER:-true}
      DOCKER_LOG_TAIL: ${DOCKER_LOG_TAIL:-200}
      DOCKER_LOG_MAX_TAIL: ${DOCKER_LOG_MAX_TAIL:-2000}
      DOCKER_LOG_BUFFER_LIMIT: ${DOCKER_LOG_BUFFER_LIMIT:-10000}
      DOCKER_LOG_ALLOWED_SERVICES: ${DOCKER_LOG_ALLOWED_SERVICES:-backend,worker,frontend,redis}
      DOCKER_LOG_REDACTION: ${DOCKER_LOG_REDACTION:-true}
    volumes:
      - recon-data:/data
      - ./wordlists:/data/wordlists
      - ./screenshots:/data/screenshots
      - ./raw-output:/data/raw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8000:8000"
    depends_on:
      - redis
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: sync
          path: ./backend/wordlists
          target: /app/wordlists
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile
    logging: *log-rotation
  worker:
    image: recon-webapp-worker:latest
    build:
      context: ./backend
      dockerfile: worker.Dockerfile
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      PATH: /root/go/bin:/usr/local/go/bin:/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      RECON_DATA_DIR: /data
      DEFAULT_FFUF_WORDLIST: /app/wordlists/default/common.txt
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - recon-data:/data
      - ./wordlists:/data/wordlists
      - ./screenshots:/data/screenshots
      - ./raw-output:/data/raw
    depends_on:
      - redis
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /app/app
        - action: sync+restart
          path: ./backend/wordlists
          target: /app/wordlists
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/worker.Dockerfile
    logging: *log-rotation
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    command: ["npm", "run", "dev"]
    ports:
      - "3001:5173"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./frontend/vite.config.mjs
          target: /app/vite.config.mjs
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/Dockerfile
    logging: *log-rotation
volumes:
  redis-data:
  recon-data:
