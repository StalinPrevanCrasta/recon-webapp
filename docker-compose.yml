services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
  backend:
    image: recon-webapp-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      RECON_DATA_DIR: /data
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - recon-data:/data
      - ./wordlists:/data/wordlists
      - ./screenshots:/data/screenshots
      - ./raw-output:/data/raw
    ports:
      - "8000:8000"
    depends_on:
      - redis
  worker:
    image: recon-webapp-backend:latest
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      RECON_DATA_DIR: /data
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - recon-data:/data
      - ./wordlists:/data/wordlists
      - ./screenshots:/data/screenshots
      - ./raw-output:/data/raw
    depends_on:
      - redis
  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
volumes:
  redis-data:
  recon-data:
